<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DDN Live Tracking</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3ynHUcMZ+fQeU8g9MZQ1fZL7S2v0uM="
    crossorigin=""
  >

  <link
    rel="stylesheet"
    href="tracking.css"
  >

</head>

<body>

  <div class="container">

    <div class="header">

      <h1>🚚 DDN Live Tracking</h1>

      <p>
        Track your delivery in real time
      </p>

    </div>

    <div class="search-card">

      <input
        type="text"
        id="bookingId"
        placeholder="Enter Booking ID"
        autocomplete="off"
      >

      <button
        type="button"
        id="trackButton"
      >
        Track Booking
      </button>

    </div>

    <div
      id="message"
      class="message"
    >
    </div>

    <div
      id="trackingCard"
      class="tracking-card"
    >

      <h2>Booking Details</h2>

      <div class="row">

        <span>
          Booking ID
        </span>

        <strong id="bookingNumber">
          -
        </strong>

      </div>

      <div class="row">

        <span>
          Status
        </span>

        <strong id="status">
          -
        </strong>

      </div>

      <div class="row">

        <span>
          Assigned Rider
        </span>

        <strong id="rider">
          -
        </strong>

      </div>

      <div class="row">

        <span>
          Pickup
        </span>

        <strong id="pickup">
          -
        </strong>

      </div>

      <div class="row">

        <span>
          Delivery
        </span>

        <strong id="delivery">
          -
        </strong>

      </div>

      <div class="row">

        <span>
          Last Updated
        </span>

        <strong id="updated">
          -
        </strong>

      </div>

    </div>

    <div
      id="mapContainer"
      class="map-container"
    >

      <div id="trackingMap"></div>

    </div>

  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  >
  </script>

  <script src="tracking.js"></script>

</body>
</html>
