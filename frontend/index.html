<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DDN – District Delivery Network</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <h1>DDN</h1>
    <p class="tagline">District Delivery Network</p>

    <!-- Book a Delivery -->
    <section class="card">
      <h2>Book a Delivery</h2>

      <form id="bookingForm">
        <input
          type="text"
          name="pickupLocation"
          placeholder="Pickup location"
          required
        >

        <input
          type="text"
          name="deliveryLocation"
          placeholder="Delivery location"
          required
        >

        <input
          type="text"
          name="customerName"
          placeholder="Customer name"
          required
        >

        <input
          type="tel"
          name="mobileNumber"
          placeholder="Mobile number"
          required
        >

        <button type="submit">Book Delivery</button>
      </form>

      <div id="bookingResult"></div>
    </section>

    <!-- Track My Delivery -->
    <section class="card">
      <h2>Track My Delivery</h2>

      <form id="trackingForm">
        <input
          type="text"
          id="trackingBookingId"
          placeholder="Enter Booking ID"
          required
        >

        <button type="submit">Track Booking</button>
      </form>

      <div id="trackingResult"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
