<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DDN – District Delivery Network</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">

    <h1>DDN</h1>

    <p class="tagline">
      District Delivery Network
    </p>

    <!-- Book a Delivery -->
    <section class="card">

      <h2>Book a Delivery</h2>

      <form id="bookingForm">

        <!-- Customer Name -->
        <input
          type="text"
          name="customerName"
          placeholder="Customer Name"
          required
        >

        <!-- Mobile Number -->
        <input
          type="tel"
          name="mobileNumber"
          placeholder="Mobile Number"
          maxlength="10"
          pattern="[0-9]{10}"
          inputmode="numeric"
          required
        >

        <!-- Pickup Address -->
        <div class="location-field">

          <label class="field-label">
            Pickup Address
          </label>

          <div
            id="pickupAutocompleteContainer"
            class="autocomplete-container"
          ></div>

          <input
            type="hidden"
            id="pickupLocation"
            name="pickupLocation"
          >

          <button
            type="button"
            id="usePickupLocationButton"
            class="location-button"
          >
            📍 Use Current Pickup Location
          </button>

          <p
            id="pickupLocationMessage"
            class="location-message"
          ></p>

        </div>

        <!-- Delivery Address -->
        <div class="location-field">

          <label class="field-label">
            Delivery Address
          </label>

          <div
            id="deliveryAutocompleteContainer"
            class="autocomplete-container"
          ></div>

          <input
            type="hidden"
            id="deliveryLocation"
            name="deliveryLocation"
          >

          <button
            type="button"
            id="useDeliveryLocationButton"
            class="location-button"
          >
            📍 Use Current Drop Location
          </button>

          <p
            id="deliveryLocationMessage"
            class="location-message"
          ></p>

        </div>

        <!-- Map -->
        <div class="map-section">

          <p class="map-instruction">
            Pickup ya delivery address select karne ke baad location map par
            दिखाई देगी.
          </p>

          <div id="bookingMap"></div>

        </div>

        <!-- PIN Code -->
        <input
          type="text"
          name="pinCode"
          placeholder="PIN Code"
          maxlength="6"
          pattern="[0-9]{6}"
          inputmode="numeric"
          required
        >

        <div id="fareEstimate" class="fare-estimate" hidden>
  <p>
    <strong>Estimated Distance:</strong>
    <span id="estimatedDistance">--</span>
  </p>

  <p>
    <strong>Delivery Charge:</strong>
    <span id="estimatedFare">--</span>
  </p>
</div>

        <!-- Submit Button -->
        <button type="submit">
          Book Delivery
        </button>

      </form>

      <div id="bookingResult"></div>

    </section>

    <!-- Track My Delivery -->
    <section class="card tracking-section">

      <h2>Track My Delivery</h2>
<form id="trackingForm">

  <input
    type="text"
    id="trackingBookingId"
    placeholder="Enter Booking ID"
    required
  >

  <button type="submit">
    Track Booking
  </button>

</form>

<div
  id="trackingMap"
  class="tracking-map"
  style="
    display:none;
    width:100%;
    height:350px;
    margin-top:20px;
    border-radius:12px;
    overflow:hidden;
  "
></div>

<div id="trackingResult"></div>

    </section>

  </main>

  

  <!-- Replace YOUR_GOOGLE_MAPS_API_KEY with your real API key -->
  <script>
    (g => {
      var h, a, k,
        p = "The Google Maps JavaScript API",
        c = "google",
        l = "importLibrary",
        q = "__ib__",
        m = document,
        b = window;

      b = b[c] || (b[c] = {});

      var d = b.maps || (b.maps = {}),
        r = new Set(),
        e = new URLSearchParams(),
        u = () =>
          h ||
          (h = new Promise(async (f, n) => {
            await (a = m.createElement("script"));

            e.set("libraries", [...r] + "");
            e.set("callback", c + ".maps." + q);
            e.set("loading", "async");
            e.set("key", g.key);
            e.set("v", g.v || "weekly");

            for (k in g) {
              if (k !== "key" && k !== "v") {
                e.set(
                  k.replace(
                    /[A-Z]/g,
                    t => "_" + t[0].toLowerCase()
                  ),
                  g[k]
                );
              }
            }

            a.src =
              `https://maps.${c}apis.com/maps/api/js?` +
              e.toString();

            d[q] = f;
            a.onerror = () =>
              n(
                new Error(
                  p + " could not load."
                )
              );

            a.nonce =
              m.querySelector("script[nonce]")?.nonce || "";

            m.head.append(a);
          }));

      d[l]
        ? console.warn(
            p + " only loads once. Ignoring:",
            g
          )
        : d[l] = (f, ...n) =>
            r.add(f) && u().then(() => d[l](f, ...n));

    })({
      key: "AIzaSyCbyuOdodDA2ocTPn5Neohy9Zv9btahKnk",
      v: "weekly"
    });
  </script>

<script src="https://ddn-platform.onrender.com/socket.io/socket.io.js"></script>
<script src="app.js?v=2"></script>

</body>
</html>
