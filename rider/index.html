<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DDN Rider Panel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Rider Login -->
  <div id="loginSection" class="container">

    <h1>DDN Rider Login</h1>
    <p class="tagline">District Delivery Network</p>

    <form id="loginForm">

      <input
        type="text"
        id="riderUsername"
        placeholder="Rider Username"
        required
      >

      <input
        type="password"
        id="riderPassword"
        placeholder="Password"
        required
      >

      <button type="submit">
        Login
      </button>

      <p id="loginMessage"></p>

    </form>

  </div>


  <!-- Rider Dashboard -->
  <main
    id="dashboardSection"
    class="container"
    style="display: none;"
  >

    <h1>DDN Rider Panel</h1>

    <p class="tagline">
      District Delivery Network
    </p>

    <button id="logoutButton">
      Logout
    </button>

    <section class="card">

      <h2>Assigned Deliveries</h2>

      <button onclick="loadDeliveries()">
        Refresh Deliveries
      </button>

      <div id="deliveriesContainer">
        <p>Loading deliveries...</p>
      </div>

    </section>

  </main>


  <script src="https://ddn-platform.onrender.com/socket.io/socket.io.js"></script>

<script src="app.js?v=3"></script>

</body>
</html>
