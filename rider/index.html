<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

   <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#ff6b00"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="application-name"
    content="DDN Rider"
  >

  <title>
    DDN Rider Panel
  </title>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- Rider Login -->
  <div
    id="loginSection"
    class="container"
  >

    <div class="rider-brand">

  <div class="rider-brand-logo">
    <img
      src="../frontend/assets/logo/ddn-logo.png"
      alt="DDN Logo"
    >
  </div>

  <div class="rider-brand-text">

    <h1>
      DDN Rider Login
    </h1>

    <p class="tagline">
      District Delivery Network
    </p>

  </div>

</div>

    <form id="loginForm">

      <input
        type="text"
        id="riderUsername"
        placeholder="Rider Username"
        required
      >

      <input
        type="password"
        id="riderPassword"
        placeholder="Password"
        required
      >

      <button type="submit">
        Login
      </button>

      <p id="loginMessage"></p>

    </form>

  </div>

<!-- Rider Mandatory Password Change -->
<section
  id="passwordChangeSection"
  class="container"
  style="display: none;"
>

  <div class="rider-brand">

    <div class="rider-brand-logo">
      <img
        src="../frontend/assets/logo/ddn-logo.png"
        alt="DDN Logo"
      >
    </div>

    <div class="rider-brand-text">

      <h1>
        Change Password
      </h1>

      <p class="tagline">
        For security, set your own password before continuing
      </p>

    </div>

  </div>

  <form id="passwordChangeForm">

    <input
      type="password"
      id="currentRiderPassword"
      placeholder="Temporary / Current Password"
      required
    >

    <input
      type="password"
      id="newRiderPassword"
      placeholder="New Password"
      minlength="8"
      required
    >

    <input
      type="password"
      id="confirmRiderPassword"
      placeholder="Confirm New Password"
      minlength="8"
      required
    >

    <button type="submit">
      Change Password
    </button>

    <p id="passwordChangeMessage"></p>

  </form>

</section>

  <!-- Rider Dashboard -->
  <main
    id="dashboardSection"
    class="container"
    style="display: none;"
  >

    <header class="rider-dashboard-header">

  <div class="rider-brand">

    <div class="rider-brand-logo">
      <img
        src="../frontend/assets/logo/ddn-logo.png"
        alt="DDN Logo"
      >
    </div>

    <div class="rider-brand-text">

      <h1>
        DDN Rider Panel
      </h1>

      <p class="tagline">
        District Delivery Network
      </p>

    </div>

  </div>

  <button
    type="button"
    id="logoutButton"
    class="rider-logout-button"
  >
    Logout
  </button>

</header>

    <section class="card rider-deliveries-section">

  <div class="rider-section-heading">

    <div>

      <span class="rider-section-kicker">
        LIVE DELIVERY WORKSPACE
      </span>

      <h2>
        Assigned Deliveries
      </h2>

      <p>
        Manage your active delivery tasks and current route.
      </p>

    </div>

    <button
      type="button"
      class="refresh-deliveries-button"
      onclick="loadDeliveries()"
    >
      Refresh Deliveries
    </button>

  </div>

  <div id="deliveriesContainer">
    <p>
      Loading deliveries...
    </p>
  </div>

</section>

  </main>


  <!-- Google Maps JavaScript API Loader -->
  <script>
    (g => {
      var h, a, k,
        p =
          "The Google Maps JavaScript API",
        c =
          "google",
        l =
          "importLibrary",
        q =
          "__ib__",
        m =
          document,
        b =
          window;

      b =
        b[c] ||
        (b[c] = {});

      var d =
          b.maps ||
          (b.maps = {}),

        r =
          new Set(),

        e =
          new URLSearchParams(),

        u =
          () =>
            h ||
            (
              h =
                new Promise(
                  async (
                    f,
                    n
                  ) => {
                    await (
                      a =
                        m.createElement(
                          "script"
                        )
                    );

                    e.set(
                      "libraries",
                      [...r] + ""
                    );

                    e.set(
                      "callback",
                      c +
                      ".maps." +
                      q
                    );

                    e.set(
                      "loading",
                      "async"
                    );

                    e.set(
                      "key",
                      g.key
                    );

                    e.set(
                      "v",
                      g.v ||
                      "weekly"
                    );

                    for (k in g) {
                      if (
                        k !==
                          "key" &&
                        k !==
                          "v"
                      ) {
                        e.set(
                          k.replace(
                            /[A-Z]/g,
                            t =>
                              "_" +
                              t[0]
                                .toLowerCase()
                          ),
                          g[k]
                        );
                      }
                    }

                    a.src =
                      `https://maps.${c}apis.com/maps/api/js?` +
                      e.toString();

                    d[q] =
                      f;

                    a.onerror =
                      () =>
                        n(
                          new Error(
                            p +
                            " could not load."
                          )
                        );

                    a.nonce =
                      m.querySelector(
                        "script[nonce]"
                      )?.nonce ||
                      "";

                    m.head.append(
                      a
                    );
                  }
                )
            );

      d[l]
        ? console.warn(
            p +
            " only loads once. Ignoring:",
            g
          )
        : d[l] =
            (
              f,
              ...n
            ) =>
              r.add(f) &&
              u().then(
                () =>
                  d[l](
                    f,
                    ...n
                  )
              );

    })({
      key:
        "AIzaSyCbyuOdodDA2ocTPn5Neohy9Zv9btahKnk",
      v:
        "weekly"
    });
  </script>


  <!-- Socket.IO -->
  <script
    src="https://ddn-platform.onrender.com/socket.io/socket.io.js"
  ></script>


  <!-- Rider Application -->
  <script
    src="app.js?v=5"
  ></script>

<script>
  if ("serviceWorker" in navigator) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register("./sw.js")
          .then(registration => {

            console.log(
              "DDN Rider service worker registered:",
              registration.scope
            );

          })
          .catch(error => {

            console.error(
              "DDN Rider service worker registration failed:",
              error
            );

          });

      }
    );

  }
</script>
  
</body>
</html>
