<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    DDN Rider Panel
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- Rider Login -->
  <div
    id="loginSection"
    class="container"
  >

    <h1>
      DDN Rider Login
    </h1>

    <p class="tagline">
      District Delivery Network
    </p>

    <form id="loginForm">

      <input
        type="text"
        id="riderUsername"
        placeholder="Rider Username"
        required
      >

      <input
        type="password"
        id="riderPassword"
        placeholder="Password"
        required
      >

      <button type="submit">
        Login
      </button>

      <p id="loginMessage"></p>

    </form>

  </div>


  <!-- Rider Dashboard -->
  <main
    id="dashboardSection"
    class="container"
    style="display: none;"
  >

    <h1>
      DDN Rider Panel
    </h1>

    <p class="tagline">
      District Delivery Network
    </p>

    <button id="logoutButton">
      Logout
    </button>

    <section class="card">

      <h2>
        Assigned Deliveries
      </h2>

      <button
        type="button"
        onclick="loadDeliveries()"
      >
        Refresh Deliveries
      </button>

      <div id="deliveriesContainer">
        <p>
          Loading deliveries...
        </p>
      </div>

    </section>

  </main>


  <!-- Google Maps JavaScript API Loader -->
  <script>
    (g => {
      var h, a, k,
        p =
          "The Google Maps JavaScript API",
        c =
          "google",
        l =
          "importLibrary",
        q =
          "__ib__",
        m =
          document,
        b =
          window;

      b =
        b[c] ||
        (b[c] = {});

      var d =
          b.maps ||
          (b.maps = {}),

        r =
          new Set(),

        e =
          new URLSearchParams(),

        u =
          () =>
            h ||
            (
              h =
                new Promise(
                  async (
                    f,
                    n
                  ) => {
                    await (
                      a =
                        m.createElement(
                          "script"
                        )
                    );

                    e.set(
                      "libraries",
                      [...r] + ""
                    );

                    e.set(
                      "callback",
                      c +
                      ".maps." +
                      q
                    );

                    e.set(
                      "loading",
                      "async"
                    );

                    e.set(
                      "key",
                      g.key
                    );

                    e.set(
                      "v",
                      g.v ||
                      "weekly"
                    );

                    for (k in g) {
                      if (
                        k !==
                          "key" &&
                        k !==
                          "v"
                      ) {
                        e.set(
                          k.replace(
                            /[A-Z]/g,
                            t =>
                              "_" +
                              t[0]
                                .toLowerCase()
                          ),
                          g[k]
                        );
                      }
                    }

                    a.src =
                      `https://maps.${c}apis.com/maps/api/js?` +
                      e.toString();

                    d[q] =
                      f;

                    a.onerror =
                      () =>
                        n(
                          new Error(
                            p +
                            " could not load."
                          )
                        );

                    a.nonce =
                      m.querySelector(
                        "script[nonce]"
                      )?.nonce ||
                      "";

                    m.head.append(
                      a
                    );
                  }
                )
            );

      d[l]
        ? console.warn(
            p +
            " only loads once. Ignoring:",
            g
          )
        : d[l] =
            (
              f,
              ...n
            ) =>
              r.add(f) &&
              u().then(
                () =>
                  d[l](
                    f,
                    ...n
                  )
              );

    })({
      key:
        "AIzaSyCbyuOdodDA2ocTPn5Neohy9Zv9btahKnk",
      v:
        "weekly"
    });
  </script>


  <!-- Socket.IO -->
  <script
    src="https://ddn-platform.onrender.com/socket.io/socket.io.js"
  ></script>


  <!-- Rider Application -->
  <script
    src="app.js?v=5"
  ></script>

</body>
</html>
